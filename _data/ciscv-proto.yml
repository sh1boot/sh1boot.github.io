    - {at: 0, n: 1, op: "lw"}
    - {at: 1, n: 1, op: "sw"}
    b:
    - {at: 0, n: 1, op: "addi", imm: {bits: 5, signed: false, scale: 4, field: 5}}
  notes:
    - "Timing oddity here because reg in `rd` field is written in first cycle not second."
    - "No shXadd clusters: a post-increment by a register-held stride is a real idiom, but neither clang nor GCC emits it adjacent to the access (zero scheduled pairs on every corpus)."
    - "Both fields earn their columns, unlike pre-inc: the access offset imma is the position inside an unrolled window (small, 67-74% within +/-16) and the stride immb is the window size (wide). They decouple under unrolling -- stride = offset + width holds at only 3-19% -- so neither a zero offset nor a delta encoding works here."
- name: "mem-sp-pair"
  does: "Two adjacent stack accesses one word apart -- a spill or reload pair."
  a_format: mixed
  id: "110001110"
  select: "110001110p"
  block: 2          # op-select indices; 2 used, 0 free
  fixed: [{name: opcode5, value: 1 1 0 0 0, type: selector, field: opcode5, range: [6, 2]}, {name: funct3, value: 1 1 1, type: selector, field: funct3, range: [14, 12]}, {name: g, value: '0', type: selector, field: g, range: [30, 30]}, {name: h, value: p, type: selector, field: h, range: [31, 31]}, {name: marker, value: 1 0, type: constant, field: marker, range: [1, 0]}]
  layout: |
    │p 0│     imm[9:0]      │   rda   │1 1 1│   rdb   │1 1 0 0 0│1 0│
    │p 0│imm[9:5] │  rs2a   │  rs2b   │1 1 1│imm[4:0] │1 1 0 0 0│1 0│
  templates:
  - id: "110001110"
    opcode: "1 1 0 0 0"
    a:
      fields: [{name: imm, bits: 10, type: imm, field: [funct5, rs2], range: [29, 20]}, {name: rda, bits: 5, type: rd, field: rs1, range: [19, 15]}]
      implicit: [{name: sp, type: rs}]
      template: "load    rda, k*imm(sp)"
    b:
      fields: [{name: imm, bits: 10, type: imm, field: [funct5, rs2], range: [29, 20]}, {name: rdb, bits: 5, type: rd, field: rd, range: [11, 7]}]
      implicit: [{name: sp, type: rs}]
      template: "load    rdb, k*imm+k(sp)"
  - id: "110001110"
    opcode: "1 1 0 0 0"
    a:
      fields: [{name: 'imm[9:5]', bits: 5, type: imm, field: funct5, range: [29, 25]}, {name: 'imm[4:0]', bits: 5, type: imm, field: rd, range: [11, 7]}, {name: rs2a, bits: 5, type: rs, field: rs2, range: [24, 20]}]
      implicit: [{name: sp, type: rs}]
      template: "store   rs2a, k*imm(sp)"
    b:
      fields: [{name: 'imm[9:5]', bits: 5, type: imm, field: funct5, range: [29, 25]}, {name: 'imm[4:0]', bits: 5, type: imm, field: rd, range: [11, 7]}, {name: rs2b, bits: 5, type: rs, field: rs1, range: [19, 15]}]
      implicit: [{name: sp, type: rs}]
      template: "store   rs2b, k*imm+k(sp)"
  opcodes:
  - select: "p"
    at: 0
    n: 2
    same_op: true
    pairs:
    - {at: 0, n: 1, a: {op: "lx", imm: {bits: 10, signed: false}}, b: {op: "lx", imm: {bits: 10, signed: false}}}
    - {at: 1, n: 1, a: {op: "sx", imm: {bits: 10, signed: false}}, b: {op: "sx", imm: {bits: 10, signed: false}}}
  notes:
    - "both opcodes in a pair must be identical operations"
    - "offsets differ by one data width, as in mem-base-pair"
- name: "mem-base-pair"
  does: "Two adjacent accesses through one base register, one data width apart."
  a_format: mixed
  id: "101101"
  select: "101101pppp"
  block: 16          # op-select indices; 16 used, 0 free
  fixed: [{name: opcode5, value: 1 0 1 1 0, type: selector, field: opcode5, range: [6, 2]}, {name: funct3, value: 1 p p, type: selector, field: funct3, range: [14, 12]}, {name: g, value: p, type: selector, field: g, range: [30, 30]}, {name: h, value: p, type: selector, field: h, range: [31, 31]}, {name: marker, value: 1 0, type: constant, field: marker, range: [1, 0]}]
  layout: |
    │p p│   rda   │imm[4:0] │  rbase  │1 p p│   rdb   │1 0 1 1 0│1 0│
    │p p│  rs2b   │  rs2a   │  rbase  │1 p p│imm[4:0] │1 0 1 1 0│1 0│
