- name: "addi-store-chain"
  does: "Form a value -- constant, copy or sp-relative address -- and store it."
  a_format: i-type
  id: "11000100"
  select: "11000100pp"
  block: 4          # op-select indices; 4 used, 0 free
  fixed: [{name: opcode5, value: 1 1 0 0 0, type: selector, field: opcode5, range: [6, 2]}, {name: funct3, value: 1 0 0, type: selector, field: funct3, range: [14, 12]}, {name: g, value: p, type: selector, field: g, range: [30, 30]}, {name: h, value: p, type: selector, field: h, range: [31, 31]}, {name: marker, value: 1 0, type: constant, field: marker, range: [1, 0]}]
  layout: |
    │p p│     imma[9:0]     │  rs1a   │1 0 0│  rbase  │1 1 0 0 0│1 0│
  templates:
  - id: "11000100"
    opcode: "1 1 0 0 0"
    a:
      fields: [{name: imma, bits: 10, type: imm, field: [funct5, rs2], range: [29, 20]}, {name: rs1a, bits: 5, type: rs, field: rs1, range: [19, 15]}]
      implicit: [{name: tmp, type: rd}]
      template: "addi    tmp, rs1a, imma"
    b:
      fields: [{name: rbase, bits: 5, type: rs, field: rd, range: [11, 7]}]
      implicit: [{name: tmp, type: rs}]
      template: "store   tmp, 0(rbase)"
  opcodes:
  - select: "bb"
    at: 0
    n: 4
    a:
    - {at: 0, n: 1, op: "addi", imm: {bits: 10, signed: true, field: 10}}
    b:
    - {at: 0, n: 1, op: "sb"}
    - {at: 1, n: 1, op: "sh"}
    - {at: 2, n: 1, op: "sw"}
    - {at: 3, n: 1, op: "sd"}
  notes:
    - "The data width comes from the op list (sb/sh/sw/sd), as in the other memory frames, rather than a width field -- 4 codepoints is cheaper than two bits of layout, and it matches existing convention. sh captures nothing on this corpus but only 3 sites carry it, which is too thin to conclude it never would."
    - "A covers li (rs1a = x0), mv (imma = 0) and addi4spn (rs1a = sp) as register/immediate choices, so they need no opcodes of their own."
- name: "addi-store-off-chain"
  does: "Compute a value from one base and store it at an offset from another."
  a_format: i-type
  id: "1011101"
  select: "1011101ppp"
  block: 8          # op-select indices; 8 used, 0 free
  fixed: [{name: opcode5, value: 1 0 1 1 1, type: selector, field: opcode5, range: [6, 2]}, {name: funct3, value: 0 1 p, type: selector, field: funct3, range: [14, 12]}, {name: g, value: p, type: selector, field: g, range: [30, 30]}, {name: h, value: p, type: selector, field: h, range: [31, 31]}, {name: marker, value: 1 0, type: constant, field: marker, range: [1, 0]}]
  layout: |
    │p p│  rbase  │imma[4:0]│  rs1a   │0 1 p│immb[4:0]│1 0 1 1 1│1 0│
  templates:
  - id: "1011101"
    opcode: "1 0 1 1 1"
    a:
      fields: [{name: imma, bits: 5, type: imm, field: rs2, range: [24, 20]}, {name: rs1a, bits: 5, type: rs, field: rs1, range: [19, 15]}]
      implicit: [{name: tmp, type: rd}]
      template: "addi    tmp, rs1a, imma"
    b:
      fields: [{name: rbase, bits: 5, type: rs, field: funct5, range: [29, 25]}, {name: immb, bits: 5, type: imm, field: rd, range: [11, 7]}]
      implicit: [{name: tmp, type: rs}]
      template: "store   tmp, k*immb(rbase)"
  opcodes:
  - select: "bbb"
    at: 0
    n: 8
    a:
    - {at: 0, n: 1, op: "addi"}
    b:
    - {at: 0, n: 2, op: "sb", imm: {bits: 6, signed: false, field: 5, ext: "imm[5:5]"}}
    - {at: 2, n: 2, op: "sh", imm: {bits: 6, signed: false, field: 5, ext: "imm[5:5]"}}
    - {at: 4, n: 2, op: "sw", imm: {bits: 6, signed: false, field: 5, ext: "imm[5:5]"}}
    - {at: 6, n: 2, op: "sd", imm: {bits: 6, signed: false, field: 5, ext: "imm[5:5]"}}
  notes:
    - "`immb` is width-scaled and unsigned; `imma` is signed -- and that asymmetry is the frame's whole shape. A memory offset carries an access width, so five bits of `immb` reach 4x or 8x further; an `addi` addend is pointer arithmetic and carries none, so its bits are bytes. `load5-load5-chain` gets a symmetric split because BOTH its immediates are scaled offsets; this frame cannot, and scaling A by the store's k would not help -- the addends are 93% ODD, only 28.8% are aligned to their own store's width, and for `sw` (65% of the population) it is 5 of 295. The stored value is the chain temporary and is not encoded."
    - "THE WIDTH BELONGS TO B, measured 2026-08-04. The row draws five bits per column, so a sixth costs a doubling. Over 455 scheduled pairs on sqlite-rv32/rv64 and cpp-rv32/rv64: A's addend fits FIVE bits 97% of the time and two bits 95% of the time, while B's scaled offset fits five only 33% of the time and six 100%. So A was paying 8 codepoints for the 2% that need a sixth bit. Dropped to 5+6: 16 codepoints to 8, at a cost of 5 pairs on sqlite-rv32 and 4 on sqlite-rv64. Narrowing B too (5+5, 4cp) costs a further 135 and 130 -- that bit is real."
    - "This is a SQLITE-shaped frame: 212 hits on sqlite-rv32 against 12 on cpp-rv32. A cpp-only reading makes it look like the worst frame in the encoding; it is not."
    - "rules.py EXCLUDES the li form (rs1a = x0) here even though the row draws rs1a and could encode it: li + store belongs to the frames that price it (addi-store-chain at offset zero, alu-store-chain up to a 5-bit offset). The residue -- li + store at an offset only this frame's sixth bit reaches -- stays solo."
