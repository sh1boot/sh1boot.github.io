  rd: x2                      # the allocated sentinel: what tells it from its host
  block: 4          # op-select indices; 4 used, 0 free
  layout: |
    │p p│     imma[9:0]     │  rs1a   │1 1 1│0 0 0 1 0│0 0 1 0 1│1 0│

    │p p│     imma[9:0]     │  rs1a   │1 1 1│0 0 0 1 0│0 0 1 0 1│1 0│   load    tmp, k*imma(rs1a)
    │p p│                   │         │1 1 1│0 0 0 1 0│0 0 1 0 1│1 0│   jalr_link_ra ra, 0(tmp)

    │p p│     imma[9:0]     │  rs1a   │1 1 1│0 0 0 1 0│0 0 1 0 1│1 0│   load    tmp, k*imma(rs1a)
