    │o│   rdb   │o│                   │0 1 o│  rsda   │1 1 0 0 1│1 0│   load    rdb, 0(rsda)

    │o│         │o│  rs2a   │  rsda   │0 1 o│         │1 1 0 0 1│1 0│   shXadd  rsda, rsda, rs2a
    │o│  rs2b   │o│         │  rsda   │0 1 o│immb[4:0]│1 1 0 0 1│1 0│   store   rs2b, k*immb(rsda)

    │o│         │o│   imma[4:0|9:5]   │0 1 o│  rsda   │1 1 0 0 1│1 0│   addi    rsda, rsda, k*imma
    │o│  rs2b   │o│                   │0 1 o│  rsda   │1 1 0 0 1│1 0│   store   rs2b, 0(rsda)
