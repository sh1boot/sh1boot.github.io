  layout: |
    │o│  rs2b   │o│  rs2a   │  rsda   │0 1 o│immb[4:0]│1 1 0 0 1│1 0│
    │o│immb[4:0]│o│  rs2a   │  rsda   │0 1 o│   rdb   │1 1 0 0 1│1 0│
    │o│  rs2b   │o│   imma[4:0|9:5]   │0 1 o│  rsda   │1 1 0 0 1│1 0│
    │o│   rdb   │o│   imma[4:0|9:5]   │0 1 o│  rsda   │1 1 0 0 1│1 0│

    │o│         │o│  rs2a   │  rsda   │0 1 o│         │1 1 0 0 1│1 0│   shXadd  rsda, rsda, rs2a
    │o│immb[4:0]│o│         │  rsda   │0 1 o│   rdb   │1 1 0 0 1│1 0│   load    rdb, k*immb(rsda)

