  layout: |
    │p p│immb[4:0]│  rs2a   │  rs1a   │1 1 p│   rdb   │1 0 1 1 1│1 0│
    │p p│  rs2b   │  rs2a   │  rs1a   │1 1 p│immb[4:0]│1 0 1 1 1│1 0│
  templates:
  - id: "1011111"
    opcode: "1 0 1 1 1"
    a:
      fields: [{name: rs2a, bits: 5, type: rs, field: rs2, range: [24, 20]}, {name: rs1a, bits: 5, type: rs, field: rs1, range: [19, 15]}]
      implicit: [{name: tmp, type: rd}]
      template: "shXadd  tmp, rs1a, rs2a"
    b:
      fields: [{name: immb, bits: 5, type: imm, field: funct5, range: [29, 25]}, {name: rdb, bits: 5, type: rd, field: rd, range: [11, 7]}]
