      fields: [{name: rs2a, bits: 5, type: rs, field: rs2, range: [24, 20]}, {name: rbase, bits: 5, type: rs, field: rs1, range: [19, 15]}, {name: imm, bits: 5, type: imm, field: rd, range: [11, 7]}]
      template: "store   rs2a, k*imm(rbase)"
    b:
      fields: [{name: rs2b, bits: 5, type: rs, field: funct5, range: [29, 25]}, {name: rbase, bits: 5, type: rs, field: rs1, range: [19, 15]}, {name: imm, bits: 5, type: imm, field: rd, range: [11, 7]}]
      template: "store   rs2b, k*imm+k(rbase)"
  opcodes:
  - select: "pppi"
    at: 0
    n: 16
    imm: {bits: 6, signed: false, field: 5, ext: "imm[5:5]"}
    same_op: true
    pairs:
    - {at: 0, n: 1, a: {op: "lbu", imm: {bits: 6, signed: false}}, b: {op: "lbu", imm: {bits: 6, signed: false}}}
    - {at: 1, n: 1, a: {op: "lhu", imm: {bits: 6, signed: false}}, b: {op: "lhu", imm: {bits: 6, signed: false}}}
    - {at: 2, n: 1, a: {op: "lw", imm: {bits: 6, signed: false}}, b: {op: "lw", imm: {bits: 6, signed: false}}}
    - {at: 3, n: 1, a: {op: "ld", imm: {bits: 6, signed: false}}, b: {op: "ld", imm: {bits: 6, signed: false}}}
    - {at: 4, n: 1, a: {op: "sb", imm: {bits: 6, signed: false}}, b: {op: "sb", imm: {bits: 6, signed: false}}}
    - {at: 5, n: 1, a: {op: "sh", imm: {bits: 6, signed: false}}, b: {op: "sh", imm: {bits: 6, signed: false}}}
    - {at: 6, n: 1, a: {op: "sw", imm: {bits: 6, signed: false}}, b: {op: "sw", imm: {bits: 6, signed: false}}}
    - {at: 7, n: 1, a: {op: "sd", imm: {bits: 6, signed: false}}, b: {op: "sd", imm: {bits: 6, signed: false}}}
  notes:
    - "both opcodes in a pair must be identical operations"
    - "No `lb`, `lh` or `lwu`: they account for 12 of 37816 scheduled slots across musl-rv32 and sqlite-rv64."
