  - id: "10000"
    opcode: "1 0 0 0 0"
    a:
      fields: [{name: imma, bits: 5, type: imm, field: rs2, range: [24, 20]}, {name: rs1a, bits: 5, type: rs, field: rs1, range: [19, 15]}]
      implicit: [{name: tmp, type: rd}]
      template: "andi    tmp, rs1a, imma"
    b:
      fields: [{name: 'immb[9:5]', bits: 5, type: imm, field: funct5, range: [29, 25]}, {name: 'immb[4:0]', bits: 5, type: imm, field: rd, range: [11, 7]}]
      implicit: [{name: tmp, type: rs}]
      template: "beqz/bnez tmp, 4*immb"
  - id: "10000"
    opcode: "1 0 0 0 0"
    a:
      fields: [{name: imma, bits: 5, type: imm, field: rs2, range: [24, 20]}, {name: rs1a, bits: 5, type: rs, field: rs1, range: [19, 15]}]
      implicit: [{name: tmp, type: rd}]
      template: "slli/srli tmp, rs1a, imma"
    b:
      fields: [{name: 'immb[9:5]', bits: 5, type: imm, field: funct5, range: [29, 25]}, {name: 'immb[4:0]', bits: 5, type: imm, field: rd, range: [11, 7]}]
      implicit: [{name: tmp, type: rs}]
      template: "beqz/bnez tmp, 4*immb"
  opcodes:
  - select: "aaabb"
    at: 0
    n: 32
    a:
    - {at: 0, n: 2, op: "andi", imm: {bits: 6, signed: false, field: 5, ext: "imm[5:5]"}}
    - {at: 2, n: 2, op: "slli", imm: {bits: 6, signed: false, field: 5, ext: "imm[5:5]"}}
    - {at: 4, n: 2, op: "srli", imm: {bits: 6, signed: false, field: 5, ext: "imm[5:5]"}}
    b:
    - {at: 0, n: 1, op: "beqz"}
    - {at: 1, n: 1, op: "bnez"}
    - {at: 2, n: 1, op: "beq"}
    - {at: 3, n: 1, op: "bne"}
  notes:
    - "The shift forms are the E1/E2 rewrite targets (low-mask and high-mask zero tests); a single-bit sign test via `slli` + `blt tmp, zero` is equivalence E5, a candidate this frame does NOT yet encode -- its b list has no blt/bge -- and rules.py matches accordingly."
- name: "li-branch-chain"
  does: "Compare a register against a constant and branch."
  a_format: i-type
  id: "0111"
  select: "0111pppppp"
  block: 64          # op-select indices; 64 used, 0 free
  fixed: [{name: opcode5, value: 0 1 1 1 p, type: selector, field: opcode5, range: [6, 2]}, {name: funct3, value: p p p, type: selector, field: funct3, range: [14, 12]}, {name: g, value: p, type: selector, field: g, range: [30, 30]}, {name: h, value: p, type: selector, field: h, range: [31, 31]}, {name: marker, value: 1 0, type: constant, field: marker, range: [1, 0]}]
  layout: |
    │p p│immb[9:5]│imma[4:0]│  rs1b   │p p p│immb[4:0]│0 1 1 1 p│1 0│
  templates:
  - id: "0111"
    opcode: "0 1 1 1 p"
    a:
      fields: [{name: imma, bits: 5, type: imm, field: rs2, range: [24, 20]}]
      implicit: [{name: tmp, type: rd}]
      template: "li      tmp, imma"
    b:
      fields: [{name: 'immb[9:5]', bits: 5, type: imm, field: funct5, range: [29, 25]}, {name: 'immb[4:0]', bits: 5, type: imm, field: rd, range: [11, 7]}, {name: rs1b, bits: 5, type: rs, field: rs1, range: [19, 15]}]
      implicit: [{name: tmp, type: rs}]
      template: "bXX     rs1b, tmp, 4*immb"
  opcodes:
  - select: "aaabbb"
    at: 0
    n: 64
    a:
    - {at: 0, n: 8, op: "li", imm: {bits: 8, signed: true, field: 5, ext: "imm[7:5]"}}
    b:
    - {at: 0, n: 1, op: "beq"}
    - {at: 1, n: 1, op: "bne"}
    - {at: 2, n: 1, op: "blt"}
    - {at: 3, n: 1, op: "bge"}
    - {at: 4, n: 1, op: "bltu"}
    - {at: 5, n: 1, op: "bgeu"}
  notes:
    - "`imma` is a 5-bit register column; `li` declares 8 bits, bought by three opcode doublings (census li fit 66.9% -> 85.3% of 2293, ~13 pairs/codepoint for the extra 32)."
    - "The row spells the constant in rs2. A site with the constant on the LEFT of an asymmetric compare (`blt tmp, rs`) is still encodable via the dead-tmp rewrite `bXX K, rs` -> `bYY rs, K+1` (blt<->bge, bltu<->bgeu) -- tmp carries only the comparison constant and dies at B, so changing its value is licensed. rules.py accepts those sites and rejects the two edge cases the rewrite cannot reach: K at the top of the field (K+1 overflows) and K = -1 under an unsigned compare (the predicate flips)."
    - "TODO: could replace li with alu op and compare result with zero (mostly?)."
