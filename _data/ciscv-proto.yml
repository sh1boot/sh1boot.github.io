    at: 0
    n: 16
    a:
    - {at: 0, n: 1, op: "mv"}
    - {at: 1, n: 1, op: "lbu"}
    - {at: 2, n: 1, op: "lw"}
    - {at: 3, n: 1, op: "ld"}
    b:
    - {at: 0, n: 1, op: "ret"}
    - {at: 1, n: 1, op: "jalr ra"}
    - {at: 2, n: 1, op: "jr"}
