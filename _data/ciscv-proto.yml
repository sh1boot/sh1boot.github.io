      template: "li      rda, imma"
    b:
      fields: [{name: 'immb[9:5]', bits: 5, type: imm, field: funct5, range: [29, 25]}, {name: 'immb[4:0]', bits: 5, type: imm, field: rd, range: [11, 7]}]
