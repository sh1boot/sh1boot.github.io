- name: "setup-jump-pair"
  does: "Set up an argument or return value, then transfer control."
  a_format: mixed
  id: "110001"
  select: "110001oooo"
  block: 16          # op-select indices; 15 used, 1 free
  layout: |
    │o│  rs1b   │o│imma[4:0]│  rs1a   │1 o o│   rda   │1 1 0 0 0│1 0│
    │o│  rs1b   │o│   imma[4:0|9:5]   │1 o o│   rda   │1 1 0 0 0│1 0│
    │o│  rs1a   │o│   immb[4:0|9:5]   │1 o o│   rda   │1 1 0 0 0│1 0│
    │o│imma[4:0]│o│   immb[4:0|9:5]   │1 o o│   rda   │1 1 0 0 0│1 0│

        (closest-fit encoding — this frame shares rows across forms)
    │o│         │o│         │  rs1a   │1 o o│   rda   │1 1 0 0 0│1 0│   mv      rda, rs1a
    │o│  rs1b   │o│         │         │1 o o│         │1 1 0 0 0│1 0│   jr      rs1b

    │o│         │o│imma[4:0]│  rs1a   │1 o o│   rda   │1 1 0 0 0│1 0│   load    rda, k*imma(rs1a)
    │o│  rs1b   │o│         │         │1 o o│         │1 1 0 0 0│1 0│   jr      rs1b
    │o│         │o│   imma[4:0|9:5]   │1 o o│   rda   │1 1 0 0 0│1 0│   load    rda, k*imma(rs1a)
    │o│  rs1b   │o│                   │1 o o│         │1 1 0 0 0│1 0│   jr      rs1b

    │o│         │o│   imma[4:0|9:5]   │1 o o│   rda   │1 1 0 0 0│1 0│   li      rda, imma
    │o│  rs1b   │o│                   │1 o o│         │1 1 0 0 0│1 0│   jr      rs1b

    │o│  rs1a   │o│                   │1 o o│   rda   │1 1 0 0 0│1 0│   mv      rda, rs1a
    │o│         │o│   immb[4:0|9:5]   │1 o o│         │1 1 0 0 0│1 0│   j       4*immb

    │o│  rs1a   │o│                   │1 o o│   rda   │1 1 0 0 0│1 0│   load    rda, 0(rs1a)
    │o│         │o│   immb[4:0|9:5]   │1 o o│         │1 1 0 0 0│1 0│   j       4*immb

    │o│imma[4:0]│o│                   │1 o o│   rda   │1 1 0 0 0│1 0│   li      rda, imma
    │o│         │o│   immb[4:0|9:5]   │1 o o│         │1 1 0 0 0│1 0│   j       4*immb
  opcodes:
  - select: "0aab"
    at: 0
    n: 8
    a:
    - {at: 0, n: 1, op: "mv"}
    - {at: 1, n: 1, op: "lbu"}
    - {at: 2, n: 1, op: "lw"}
    - {at: 3, n: 1, op: "ld"}
    b:
    - {at: 0, n: 1, op: "ret"}
    - {at: 1, n: 1, op: "jalr"}
  - select: "110b"
    at: 12
    n: 2
    a:
    - {at: 0, n: 1, op: "li"}
    b:
    - {at: 0, n: 1, op: "ret"}
    - {at: 1, n: 1, op: "jalr"}
  - select: "10aa"
    at: 8
    n: 4
    a:
    - {at: 0, n: 1, op: "mv"}
    - {at: 1, n: 1, op: "lbu"}
    - {at: 2, n: 1, op: "lw"}
    - {at: 3, n: 1, op: "ld"}
    b:
    - {at: 0, n: 1, op: "j", imm: {bits: 10, signed: true, scale: 4, field: 10}}
  - select: "1110"
    at: 14
    n: 1
    a:
    - {at: 0, n: 1, op: "li"}
    b:
    - {at: 0, n: 1, op: "j"}
- name: "load-sp-branch-pair"
  does: "Load a stack slot and branch on whether it is zero; the value survives."
  a_format: load
  id: "1100100"
  select: "1100100ooo"
  block: 8          # op-select indices; 8 used, 0 free
  layout: |
    │o│   rda   │o│   imma[4:0|9:5]   │0 0 o│immb[4:0]│1 1 0 0 1│1 0│

    │o│   rda   │o│   imma[4:0|9:5]   │0 0 o│         │1 1 0 0 1│1 0│   load    rda, k*imma(sp)
    │o│   rda   │o│                   │0 0 o│immb[4:0]│1 1 0 0 1│1 0│   beqz/bnez rda, zero, 4*immb
