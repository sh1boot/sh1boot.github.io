- name: "pre-inc-pair"
  does: "Advance a pointer, then access through it (pre-increment)."
  a_format: i-type
  id: "1011110"
  select: "1011110ppp"
  block: 8          # op-select indices; 8 used, 0 free
  fixed: [{name: opcode5, value: 1 0 1 1 1, type: selector, field: opcode5, range: [6, 2]}, {name: funct3, value: 1 0 p, type: selector, field: funct3, range: [14, 12]}, {name: g, value: p, type: selector, field: g, range: [30, 30]}, {name: h, value: p, type: selector, field: h, range: [31, 31]}, {name: marker, value: 1 0, type: constant, field: marker, range: [1, 0]}]
  layout: |
    │p p│  rs2b   │  rsda   │  rs1a   │1 0 p│immb[4:0]│1 0 1 1 1│1 0│
    │p p│immb[4:0]│  rsda   │  rs1a   │1 0 p│   rdb   │1 0 1 1 1│1 0│
    │p p│     imma[9:0]     │  rsda   │1 0 p│  rs2b   │1 0 1 1 1│1 0│
    │p p│     imma[9:0]     │  rsda   │1 0 p│   rdb   │1 0 1 1 1│1 0│
  templates:
  - id: "1011110"
    opcode: "1 0 1 1 1"
    a:
      fields: [{name: rsda, bits: 5, type: rsd, field: rs2, range: [24, 20]}, {name: rs1a, bits: 5, type: rs, field: rs1, range: [19, 15]}]
      template: "shXadd  rsda, rs1a, rsda"
    b:
      fields: [{name: immb, bits: 5, type: imm, field: funct5, range: [29, 25]}, {name: rsda, bits: 5, type: rsd, field: rs2, range: [24, 20]}, {name: rdb, bits: 5, type: rd, field: rd, range: [11, 7]}]
      template: "load    rdb, k*immb(rsda)"
  - id: "1011110"
    opcode: "1 0 1 1 1"
    a:
      fields: [{name: imma, bits: 10, type: imm, field: [funct5, rs2], range: [29, 20]}, {name: rsda, bits: 5, type: rsd, field: rs1, range: [19, 15]}]
      template: "addi    rsda, rsda, k*imma"
    b:
      fields: [{name: rsda, bits: 5, type: rsd, field: rs1, range: [19, 15]}, {name: rdb, bits: 5, type: rd, field: rd, range: [11, 7]}]
      template: "load    rdb, 0(rsda)"
  - id: "1011110"
    opcode: "1 0 1 1 1"
    a:
      fields: [{name: rsda, bits: 5, type: rsd, field: rs2, range: [24, 20]}, {name: rs1a, bits: 5, type: rs, field: rs1, range: [19, 15]}]
      template: "shXadd  rsda, rs1a, rsda"
    b:
      fields: [{name: rs2b, bits: 5, type: rs, field: funct5, range: [29, 25]}, {name: rsda, bits: 5, type: rsd, field: rs2, range: [24, 20]}, {name: immb, bits: 5, type: imm, field: rd, range: [11, 7]}]
      template: "store   rs2b, k*immb(rsda)"
  - id: "1011110"
    opcode: "1 0 1 1 1"
    a:
      fields: [{name: imma, bits: 10, type: imm, field: [funct5, rs2], range: [29, 20]}, {name: rsda, bits: 5, type: rsd, field: rs1, range: [19, 15]}]
      template: "addi    rsda, rsda, k*imma"
    b:
      fields: [{name: rsda, bits: 5, type: rsd, field: rs1, range: [19, 15]}, {name: rs2b, bits: 5, type: rs, field: rd, range: [11, 7]}]
      template: "store   rs2b, 0(rsda)"
  opcodes:
  - select: "00b"
    at: 0
    n: 2
    a:
    - {at: 0, n: 1, op: "addi", imm: {bits: 10, signed: true, scale: 8, field: 10}}
    b:
    - {at: 0, n: 1, op: "ld"}
    - {at: 1, n: 1, op: "sd"}
  - select: "01b"
    at: 2
    n: 2
    a:
    - {at: 0, n: 1, op: "addi", imm: {bits: 10, signed: true, scale: 4, field: 10}}
    b:
    - {at: 0, n: 1, op: "lw"}
    - {at: 1, n: 1, op: "sw"}
  - select: "10b"
    at: 4
    n: 2
    a:
    - {at: 0, n: 1, op: "sh3add"}
    b:
    - {at: 0, n: 1, op: "ld"}
    - {at: 1, n: 1, op: "sd"}
  - select: "11b"
    at: 6
    n: 2
    a:
    - {at: 0, n: 1, op: "sh2add"}
    b:
    - {at: 0, n: 1, op: "lw"}
    - {at: 1, n: 1, op: "sw"}
  notes:
    - "The addi rows access AT the bumped pointer: at genuine (non- prologue) surviving-sum sites the memory offset is zero 68-78% of the time, so the rows spend no immb and give the bump the freed column instead -- a 10-bit width-scaled imma, which the op declares at no extra codepoints. Even so the bump population is structurally wide (record-sized walks: 10-bit scaled fit is 39-59%); this is the affordable ceiling, not full coverage."
    - "The shXadd rows keep the 5-bit scaled immb: their stride is the register, so the offset field still earns its column."
    - "The shXadd form is the scaled POINTER WALK, `shXadd rsda, rs1a, rsda` (Zba: rd = rs2 + (rs1 << X)) -- the pointer advanced by a scaled stride, which is what \"advance a pointer\" means and the form the corpus emits (its in-place-scaling sibling `shXadd a, a, x` measured 69 scheduled pairs on sqlite-rv64 against this form's 210; one row decodes one operand binding, so rules.py admits only this one). The row is drawn at the STANDARD Zba read ports: the shifted stride `rs1a` in the rs1 column, the pointer `rsda` in rs2 -- Zba's rs2 position. B needs no port for its base at all: a pre-increment accesses through the UPDATED pointer, which is A's result, forwarded inside the packet -- so nothing competes with A for the columns and the operand-position discipline holds without a trade."
