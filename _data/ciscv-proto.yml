    │o│  rs2b   │o│imma[4:0]│  rsda   │o o o│  rsdb   │0 0 o o o│1 0│
    │o│immb[4:0]│o│  rs2a   │  rsda   │o o o│  rsdb   │0 0 o o o│1 0│
