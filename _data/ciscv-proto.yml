- name: "inc-branch-pair"
  does: "Step a loop counter by one and branch on the comparison."
  a_format: mixed
  id: "101100"
  select: "101100pppp"
  block: 16          # op-select indices; 16 used, 0 free
  fixed: [{name: opcode5, value: 1 0 1 1 0, type: selector, field: opcode5, range: [6, 2]}, {name: funct3, value: 0 p p, type: selector, field: funct3, range: [14, 12]}, {name: g, value: p, type: selector, field: g, range: [30, 30]}, {name: h, value: p, type: selector, field: h, range: [31, 31]}, {name: marker, value: 1 0, type: constant, field: marker, range: [1, 0]}]
  layout: |
    │p p│immb[9:5]│  rs2b   │  rsda   │0 p p│immb[4:0]│1 0 1 1 0│1 0│
  templates:
  - id: "101100"
    opcode: "1 0 1 1 0"
    a:
      fields: [{name: rsda, bits: 5, type: rsd, field: rs1, range: [19, 15]}]
      template: "inc/dec  rsda"
    b:
      fields: [{name: 'immb[9:5]', bits: 5, type: imm, field: funct5, range: [29, 25]}, {name: 'immb[4:0]', bits: 5, type: imm, field: rd, range: [11, 7]}, {name: rs2b, bits: 5, type: rs, field: rs2, range: [24, 20]}, {name: rsda, bits: 5, type: rsd, field: rs1, range: [19, 15]}]
      template: "bXX     rsda, rs2b, 4*immb"
  opcodes:
  - select: "0bbb"
    at: 0
    n: 8
    a:
    - {at: 0, n: 1, op: "inc"}
    b:
    - {at: 0, n: 1, op: "beq"}
    - {at: 1, n: 1, op: "bne"}
    - {at: 2, n: 1, op: "blt"}
    - {at: 3, n: 1, op: "bltu"}
    - {at: 4, n: 1, op: "bltu_r"}
    - {at: 5, n: 1, op: "bge"}
    - {at: 6, n: 1, op: "bgeu"}
    - {at: 7, n: 1, op: "bgeu_r"}
  - select: "1bbb"
    at: 8
    n: 8
    a:
    - {at: 0, n: 1, op: "dec"}
    b:
    - {at: 0, n: 1, op: "beq"}
    - {at: 1, n: 1, op: "bne"}
    - {at: 2, n: 1, op: "blt"}
    - {at: 3, n: 1, op: "bltu"}
    - {at: 4, n: 1, op: "bltu_r"}
    - {at: 5, n: 1, op: "bge_r"}
    - {at: 6, n: 1, op: "bgeu"}
    - {at: 7, n: 1, op: "bgeu_r"}
  notes:
    - "The step is +/-1, implied by the opcode (`inc`/`dec` = `addi rsda, rsda, +/-1`): 88% of adjacent counter-branch sites compare against a REGISTER, so the immediate column goes to `rs2b` instead of a step field; `rs2b = x0` gives every vs-zero form for free. Full XLEN width only -- there are no `w` forms."
    - "`_r` marks the operand-reversed spelling (the counter in rs2). The two clusters are the best sixteen JOINT direction x mode cells of the adjacent-site census, not a mode product: down-loops are bltu/bgeu-heavy (pointer-vs-limit, both operand orders), up-loops beq/bne with bge/bgeu sum-first. Joint enumeration covers 98.7% of adjacent sites against ~79% for the best 4-mode x 2-direction product at the same sixteen entries."
    - "The scheduler also matches `addiw rsd, rsd, +/-1` and bills it here. That is optimistic for unsigned int counters on rv64 (defined wrap is not width-equivalent) in the same spirit as RVC- eligibility; signed counters are provably width-equivalent (overflow is UB), so a packet-targeted compiler emits `addi`."
    - "`immb` is the branch displacement in packets. Displacements are unresolved labels in the corpus, so pairwise fit is unmeasured; the label-distance study puts 10-bit fit near 100%."
- name: "bit-test-branch-chain"
  does: "Test a bit or bit-field and branch on the result."
  a_format: i-type
  id: "10000"
  select: "10000ppppp"
  block: 32          # op-select indices; 32 used, 0 free
  fixed: [{name: opcode5, value: 1 0 0 0 0, type: selector, field: opcode5, range: [6, 2]}, {name: funct3, value: p p p, type: selector, field: funct3, range: [14, 12]}, {name: g, value: p, type: selector, field: g, range: [30, 30]}, {name: h, value: p, type: selector, field: h, range: [31, 31]}, {name: marker, value: 1 0, type: constant, field: marker, range: [1, 0]}]
  layout: |
    │p p│immb[9:5]│imma[4:0]│  rs1a   │p p p│immb[4:0]│1 0 0 0 0│1 0│
