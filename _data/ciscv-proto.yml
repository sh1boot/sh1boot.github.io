  a_format: load
  id: "0110"
  select: "0110pppppp"
  block: 64          # op-select indices; 64 used, 0 free
  fixed: [{name: opcode5, value: 0 1 1 0 p, type: selector, field: opcode5, range: [6, 2]}, {name: funct3, value: p p p, type: selector, field: funct3, range: [14, 12]}, {name: g, value: p, type: selector, field: g, range: [30, 30]}, {name: h, value: p, type: selector, field: h, range: [31, 31]}, {name: marker, value: 1 0, type: constant, field: marker, range: [1, 0]}]
