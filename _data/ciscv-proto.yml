    │o│   rda   │o│imm[4:0] │  rbase  │0 o o│         │1 1 0 0 0│1 0│   load    rda, k*imm(rbase)
    │o│         │o│imm[4:0] │  rbase  │0 o o│   rdb   │1 1 0 0 0│1 0│   load    rdb, k*imm+k(rbase)

    │o│         │o│  rs2a   │  rbase  │0 o o│imm[4:0] │1 1 0 0 0│1 0│   store   rs2a, k*imm(rbase)
    │o│  rs2b   │o│         │  rbase  │0 o o│imm[4:0] │1 1 0 0 0│1 0│   store   rs2b, k*imm+k(rbase)
