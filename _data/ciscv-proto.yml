      fields: [{name: rda, bits: 5, type: rd, field: funct5, range: [29, 25]}, {name: imm, bits: 5, type: imm, field: rs2, range: [24, 20]}, {name: rbase, bits: 5, type: rs, field: rs1, range: [19, 15]}]
